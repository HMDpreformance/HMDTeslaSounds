<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HMD Engine Sounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,100..125,400..800;1,100..125,400..900&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: dashboard split, tach cluster on the left, garage on the right; stacks on narrow screens.
   HMD Performance look: brushed chrome on black with racing red, extended italic type. Single dark look for a cabin at night. */
:root {
  --bg: #050506;
  --panel: #0f1012;
  --panel-2: #18191c;
  --line: #2a2b30;
  --fg: #f1f2f4;
  --muted: #8d9098;
  --chrome-hi: #ffffff;
  --chrome: #c9ccd2;
  --chrome-lo: #6f737b;
  --accent: #ff7a00;
  --accent-2: #ffa632;
  --accent-deep: #b34700;
  --red: #e3101c;
  --ok: #3ccf7a;
  --font-display: "Saira", "Arial Black", "Roboto", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 500px at 70% -10%, rgba(255, 122, 0, 0.16), transparent 70%), var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 62px; width: auto; max-width: 62vw; object-fit: contain; display: block; filter: drop-shadow(0 0 14px rgba(255, 122, 0, 0.35)); }
.brand b {
  font: italic 700 13px/1 var(--font-display); font-stretch: 125%;
  letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted);
  padding-left: 12px; border-left: 1px solid var(--line);
}
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 14px; font-weight: 500;
  color: var(--muted);
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.on { color: var(--fg); }
.pill.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.pill.wait i { background: var(--accent-2); }
.pill.err i { background: var(--red); }

main.grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 14px;
}
@media (max-width: 820px) { main.grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .brand b { display: none; } .brand img { height: 48px; } }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  min-width: 0;
}
.cluster {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  background-color: var(--panel);
  background-image:
    radial-gradient(70% 55% at 50% 42%, rgba(255, 122, 0, 0.12), transparent 70%),
    linear-gradient(45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.035) 75%),
    linear-gradient(45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.035) 75%);
  background-size: auto, 8px 8px, 8px 8px;
  background-position: 0 0, 0 0, 4px 4px;
}
.gauge-box { position: relative; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1 / 1; }
#gauge { width: 100%; height: 100%; display: block; }
.icon-btn {
  position: absolute; top: 0; right: 0;
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }
.throttle { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.throttle .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.throttle .bar div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-deep), var(--accent) 60%, var(--accent-2)); border-radius: 4px; box-shadow: 0 0 10px rgba(255, 122, 0, 0.6); }
.throttle output { width: 3.2em; text-align: right; font: italic 700 15px var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums; }

.drive-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
/* toggles: recessed track, the chosen side lights up like a dash switch */
.seg { display: inline-flex; gap: 3px; padding: 4px; border-radius: 13px;
  background: linear-gradient(180deg, #060607, #121316); border: 1px solid #000;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.06); }
.seg button {
  position: relative; border: 0; background: transparent; color: var(--muted);
  font: italic 700 14px var(--font-display); font-stretch: 112%; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 10px 16px 10px 26px; border-radius: 9px; cursor: pointer;
}
.seg button::before { content: ""; position: absolute; left: 11px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: #2c2d31; box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.8); }
.seg button[aria-pressed="true"] {
  color: #141518;
  background: linear-gradient(180deg, #ffffff, #d9dce1 45%, #a4a8af 55%, #e6e8eb);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 -1px 0 rgba(0, 0, 0, 0.35) inset, 0 3px 8px rgba(0, 0, 0, 0.6);
}
.seg button[aria-pressed="true"]::before { background: var(--accent); box-shadow: 0 0 6px var(--accent), 0 0 12px rgba(255, 122, 0, 0.6); }

/* pedals: drilled aluminium with rubber grip strips */
.pedal {
  flex: 1; min-width: 120px; position: relative; overflow: hidden;
  border: 1px solid #000; border-radius: 14px; color: #1a1b1e;
  background:
    radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.55) 0 2.4px, transparent 3px) 0 0 / 16px 16px,
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #f2f3f5, #c3c6cc 40%, #8f939a 60%, #d2d5da);
  font: italic 900 18px var(--font-display); font-stretch: 125%; letter-spacing: 0.16em; text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 4px 0 #2a2b2f, 0 8px 14px rgba(0, 0, 0, 0.6);
  padding: 14px; cursor: pointer; touch-action: none; transition: transform 0.06s, box-shadow 0.06s;
}
.pedal::before, .pedal::after { content: ""; position: absolute; left: 10px; right: 10px; height: 5px; border-radius: 3px; background: #1c1d20; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9); }
.pedal::before { top: 6px; } .pedal::after { bottom: 6px; }
.pedal.down { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 1px 0 #2a2b2f, 0 2px 6px rgba(0, 0, 0, 0.6); }
.pedal.gas.down { color: #2a0f00; background:
    radial-gradient(circle at 50% 50%, rgba(80, 20, 0, 0.6) 0 2.4px, transparent 3px) 0 0 / 16px 16px,
    linear-gradient(180deg, #ffd08a, var(--accent-2) 35%, var(--accent) 60%, var(--accent-deep));
  box-shadow: 0 0 22px rgba(255, 122, 0, 0.7), 0 1px 0 #2a2b2f; text-shadow: none; }
.pedal.brake { color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); background:
    radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.5) 0 2.4px, transparent 3px) 0 0 / 16px 16px,
    linear-gradient(180deg, #ff5660, var(--red) 50%, #8a0710); }
.pedal.brake.down { box-shadow: 0 0 22px rgba(227, 16, 28, 0.7), 0 1px 0 #2a2b2f; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

.side { display: flex; flex-direction: column; gap: 14px; }
/* push-start button: chrome bezel, red rubber cap with a glowing ring, on a carbon plate */
#start {
  width: 100%; border: 1px solid #000; border-radius: 18px; cursor: pointer; padding: 14px 20px;
  display: flex; align-items: center; gap: 18px; text-align: left; color: var(--fg);
  background:
    linear-gradient(100deg, rgba(227, 16, 28, 0.28), transparent 55%),
    repeating-linear-gradient(45deg, #17181b 0 4px, #0d0e10 4px 8px),
    #0d0e10;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 12px 30px -10px rgba(227, 16, 28, 0.55);
}
#start .knob {
  flex: none; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(from 200deg, #ffffff, #8b9098, #f4f5f7, #5f646c, #e9ebee, #7d828a, #ffffff);
  box-shadow: 0 0 0 3px #050506, 0 0 0 5px rgba(227, 16, 28, 0.55), 0 0 22px rgba(227, 16, 28, 0.55), 0 6px 14px rgba(0, 0, 0, 0.8);
  transition: transform 0.08s, box-shadow 0.3s;
}
#start .cap {
  width: 70px; height: 70px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: radial-gradient(circle at 40% 30%, #ff6a72, #d4111c 45%, #7a0610 100%);
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.45), inset 0 -4px 8px rgba(0, 0, 0, 0.55), 0 0 0 2px #2a0306;
  color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6);
}
#start .cap svg { width: 22px; height: 22px; filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7)); }
#start .cap em { font: italic 800 8px/1.05 var(--font-display); font-stretch: 112%; letter-spacing: 0.08em; text-transform: uppercase; }
#start .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#start .txt > span {
  font: italic 900 26px/1 var(--font-display); font-stretch: 125%; letter-spacing: 0.1em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 15%, #c9ccd2 55%, #8b9098 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
#start .txt small { color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
#start:active .knob { transform: scale(0.96); }
#start.running { background: linear-gradient(100deg, rgba(60, 207, 122, 0.2), transparent 55%), repeating-linear-gradient(45deg, #17181b 0 4px, #0d0e10 4px 8px), #0d0e10;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 12px 30px -10px rgba(60, 207, 122, 0.45); }
#start.running .knob { box-shadow: 0 0 0 3px #050506, 0 0 0 5px rgba(60, 207, 122, 0.8), 0 0 26px rgba(60, 207, 122, 0.7), 0 6px 14px rgba(0, 0, 0, 0.8); }
#start.running .cap { background: radial-gradient(circle at 40% 30%, #ff6a72, #b80f19 45%, #5c040b 100%); }
@media (max-width: 420px) { #start .knob { width: 72px; height: 72px; } #start .cap { width: 57px; height: 57px; } #start .txt > span { font-size: 21px; } }
#start:focus-visible, button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

.stage { display: flex; flex-direction: column; gap: 10px; }
.stage svg { width: 100%; max-width: 460px; margin: 0 auto; display: block; }
.car-info h2 {
  margin: 0; font: italic 800 28px/1.1 var(--font-display); font-stretch: 112%; text-wrap: balance;
  background: linear-gradient(180deg, var(--chrome-hi) 10%, var(--chrome) 55%, var(--chrome-lo) 95%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.car-info p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.car-info { padding: 14px 16px; border-radius: 14px; background: linear-gradient(100deg, rgba(255, 122, 0, 0.22), var(--panel-2) 55%); border: 1px solid var(--line); }

.picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.picker button {
  position: relative; overflow: hidden;
  border: 1px solid #000; color: var(--fg);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 40%), repeating-linear-gradient(45deg, #16171a 0 3px, #101113 3px 6px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 10px rgba(0, 0, 0, 0.5);
  border-radius: 12px; padding: 8px 6px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: italic 700 14px var(--font-display); font-stretch: 108%;
}
.picker button svg { width: 100%; height: auto; }
.picker button small { color: var(--muted); font: 500 12px var(--font-body); }
.picker button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
.picker button[aria-pressed="true"] {
  background: radial-gradient(120% 80% at 50% 100%, rgba(255, 122, 0, 0.35), transparent 60%), repeating-linear-gradient(45deg, #1a1b1e 0 3px, #121316 3px 6px);
  border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(255, 166, 50, 0.6), 0 0 18px -4px rgba(255, 122, 0, 0.8);
}
.picker button[aria-pressed="true"]::after { background: linear-gradient(90deg, transparent, var(--accent-2), transparent); box-shadow: 0 0 10px var(--accent); }

.settings { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; font-size: 14px; color: var(--muted); }
.settings input[type=range] { width: 100%; accent-color: var(--accent); }
.settings output { color: var(--fg); font: italic 700 15px var(--font-display); min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }

/* Fullscreen cluster view */
body.fs .side, body.fs header.top, body.fs .drive-row, body.fs .hint { display: none; }
body.fs main.grid { grid-template-columns: minmax(0, 1fr); }
body.fs .gauge-box { max-width: min(92vw, 110vh); }
body.fs .cluster { border: 0; background: transparent; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="hmd-logo.webp" alt="HMD Performance">
      <b>Engine Sounds</b>
    </div>
    <div class="pills">
      <span class="pill" id="gpsPill"><i></i><span>GPS off</span></span>
      <span class="pill" id="engPill"><i></i><span>Engine off</span></span>
    </div>
  </header>

  <main class="grid">
    <section class="card cluster" aria-label="Instrument cluster">
      <div class="gauge-box">
        <canvas id="gauge" aria-label="Tachometer and speed"></canvas>
        <button class="icon-btn" id="fsBtn" aria-label="Full screen gauge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        </button>
      </div>
      <div class="drive-row">
        <div class="seg" role="group" aria-label="Speed source">
          <button id="modeGps" aria-pressed="true">GPS</button>
          <button id="modeDemo" aria-pressed="false">Demo</button>
        </div>
        <button class="pedal gas" id="gasBtn">Rev</button>
        <button class="pedal brake" id="brakeBtn" hidden>Brake</button>
      </div>
      <p class="hint" id="hint">GPS mode follows your real speed. Hold Rev to blip the engine while stopped.</p>
    </section>

    <section class="card side" aria-label="Garage">
      <button id="start"><span class="knob"><span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M6.6 6.6a7.5 7.5 0 1 0 10.8 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><em>Engine</em><em>Start · Stop</em></span></span><span class="txt"><span id="startLabel">Start engine</span><small id="startSub">Push to fire it up</small></span></button>
      <div class="stage">
        <div id="hero"></div>
        <div class="car-info"><h2 id="carName"></h2><p id="carSpec"></p></div>
      </div>
      <div class="picker" id="picker"></div>
      <div class="settings">
        <label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="80"><output id="volOut">80%</output>
        <label for="sens">Throttle feel</label><input type="range" id="sens" min="50" max="250" value="100"><output id="sensOut">1.0×</output>
        <label for="bangVol">Bangs</label><input type="range" id="bangVol" min="0" max="250" value="150"><output id="bangVolOut">150%</output>
        <label for="agg">Limiter</label><input type="range" id="agg" min="10" max="30" value="25"><output id="aggOut">2.5×</output>
        <span>Flywheel</span>
        <div class="seg" role="group" aria-label="Flywheel" style="justify-self:start">
          <button id="flyStock" aria-pressed="true">Stock</button>
          <button id="flyLight" aria-pressed="false">Light race</button>
        </div>
        <span></span>
        <span class="turbo-row">Turbo</span>
        <div class="seg turbo-row" role="group" aria-label="VTC turbo" style="justify-self:start">
          <button id="turboOff" aria-pressed="true">NA</button>
          <button id="turboOn" aria-pressed="false">Turbo</button>
        </div>
        <span class="turbo-row"></span>
        <span>Cam</span>
        <div class="seg" role="group" aria-label="Camshaft" style="justify-self:start">
          <button id="camStock" aria-pressed="true">Stock</button>
          <button id="camRace" aria-pressed="false">Race</button>
          <button id="camBig" aria-pressed="false">Big cam</button>
        </div>
        <span></span>
        <span>Units</span>
        <div class="seg" role="group" aria-label="Speed units" style="justify-self:start">
          <button id="uKmh" aria-pressed="true">km/h</button>
          <button id="uMph" aria-pressed="false">mph</button>
        </div>
        <span></span>
      </div>
    </section>
  </main>
</div>

<script>

  { id: "v8", name: "Ford Mustang GT", short: "Mustang V8", spec: "5.0 L Coyote V8 · 7,500 rpm · 6-speed manual",
    color: "#2a5bd7",

    accel: 4.8, shiftTime: 0.25, revUp: 11000, revDown: 7000,

function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return "#" + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}

function wheelSVG(cx, cy, r, spec, u) {
  const rim = spec.rim, rr = r * (spec.rimRatio || 0.7), col = rim.color;
  const hi = mixHex(col, "#ffffff", 0.45), lo = mixHex(col, "#000000", 0.45);
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#tire${u})"/>`;
  s += `<path d="M ${cx - r * 0.82} ${cy - r * 0.45} A ${r * 0.94} ${r * 0.94} 0 0 1 ${cx + r * 0.82} ${cy - r * 0.45}" fill="none" stroke="#3a3c40" stroke-width="${r * 0.04}" opacity=".7"/>`;
  // brake disc and caliper sit behind the spokes
  s += `<circle cx="${cx}" cy="${cy}" r="${rr * 0.9}" fill="url(#disc${u})"/>`;
  if (spec.caliper) {
    const a0 = -2.5, a1 = -1.65, ri = rr * 0.55, ro = rr * 0.86;
    const p = (a, rad) => `${(cx + Math.cos(a) * rad).toFixed(1)} ${(cy + Math.sin(a) * rad).toFixed(1)}`;
    s += `<path d="M ${p(a0, ro)} A ${ro} ${ro} 0 0 1 ${p(a1, ro)} L ${p(a1, ri)} A ${ri} ${ri} 0 0 0 ${p(a0, ri)} Z" fill="${spec.caliper}" stroke="${mixHex(spec.caliper, "#000000", 0.4)}" stroke-width="0.8"/>`;
  }
  const n = rim.spokes;
  if (rim.style === "aero") {
    s += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="url(#rim${u})"/>`;
    for (let k = 0; k < n; k++) {
      const a = k * Math.PI * 2 / n - Math.PI / 2;
      const p1 = [cx + Math.cos(a) * rr * 0.42, cy + Math.sin(a) * rr * 0.42], p2 = [cx + Math.cos(a + 0.45) * rr * 0.86, cy + Math.sin(a + 0.45) * rr * 0.86];
      s += `<path d="M ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q ${(cx + Math.cos(a + 0.35) * rr * 0.8).toFixed(1)} ${(cy + Math.sin(a + 0.35) * rr * 0.8).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" stroke="${lo}" stroke-width="${rr * 0.09}" stroke-linecap="round" fill="none"/>`;
    }
  } else {
    let spokes = "";
    const sp = (a, w0, w1, r0, r1) => {
      const q = (ang, rad) => `${(cx + Math.cos(ang) * rad).toFixed(1)} ${(cy + Math.sin(ang) * rad).toFixed(1)}`;
      return `<path d="M ${q(a - w0, r0)} L ${q(a - w1, r1)} L ${q(a + w1, r1)} L ${q(a + w0, r0)} Z"/>`;
    };
    for (let k = 0; k < n; k++) {
      const a = k * Math.PI * 2 / n - Math.PI / 2;
      if (rim.style === "split") { spokes += sp(a - 0.09, 0.05, 0.045, rr * 0.22, rr * 0.95) + sp(a + 0.09, 0.05, 0.045, rr * 0.22, rr * 0.95); }
      else if (rim.style === "y") { spokes += sp(a, 0.16, 0.07, rr * 0.22, rr * 0.55) + sp(a - 0.2, 0.06, 0.05, rr * 0.5, rr * 0.95) + sp(a + 0.2, 0.06, 0.05, rr * 0.5, rr * 0.95); }
      else if (rim.style === "mesh") { spokes += sp(a, 0.07, 0.03, rr * 0.22, rr * 0.95) + sp(a + Math.PI / n, 0.05, 0.03, rr * 0.5, rr * 0.95); }
      else { const w = spec.spokeW || (n <= 6 ? 0.2 : 0.09); spokes += sp(a, w, w * 0.62, rr * 0.22, rr * 0.95); }
    }
    s += `<g fill="url(#rim${u})" stroke="${lo}" stroke-width="0.6">${spokes}</g>`;
    if (rim.style === "mesh") s += `<circle cx="${cx}" cy="${cy}" r="${rr * 0.5}" fill="none" stroke="url(#rim${u})" stroke-width="${rr * 0.06}"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${rr * 0.96}" fill="none" stroke="url(#rim${u})" stroke-width="${rr * 0.09}"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${hi}" stroke-width="${rr * 0.025}" opacity=".8"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${rr * 0.24}" fill="url(#rim${u})" stroke="${lo}" stroke-width="0.8"/>`;
  if (spec.centerlock) s += `<circle cx="${cx}" cy="${cy}" r="${rr * 0.13}" fill="#e2242f"/><circle cx="${cx}" cy="${cy}" r="${rr * 0.06}" fill="${lo}"/>`;
  else for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5; s += `<circle cx="${(cx + Math.cos(a) * rr * 0.13).toFixed(1)}" cy="${(cy + Math.sin(a) * rr * 0.13).toFixed(1)}" r="${(rr * 0.03).toFixed(1)}" fill="${lo}"/>`; }
  return s;

// the photo, cut out from its studio background, standing on a soft shadow
function vtcPhoto(u) {
  return `<svg viewBox="0 0 480 172" aria-hidden="true"><defs>
    <radialGradient id="phs${u}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs><ellipse cx="248" cy="160" rx="196" ry="10" fill="url(#phs${u})"/>
  <image href="${VTC_PHOTO}" x="56" y="2" width="368" height="168" preserveAspectRatio="xMidYMid meet"/></svg>`;
}
// Patrol Y61 Super Safari, drawn to scale (about 0.083 px per mm): 5.05 m long, 2.97 m wheelbase, 32-inch tyres.
function vtcSVG(u) {
  const G = 160, R = 33, cy = G - R, W = [132, 378], RA = 40, sill = 130;
  const f = (n) => n.toFixed(1);
  const arch = (cx, r, y) => { const dx = Math.sqrt(r * r - (y - cy) * (y - cy)); return [cx - dx, cx + dx]; };
  const [rl, rr] = arch(W[0], RA, sill), [fl, fr] = arch(W[1], RA, sill);
  const body = `M 36 ${sill} L 34 108 L 35 30 C 35 20 38 16 46 15 L 296 13 C 304 13 307 15 310 19 L 338 60 C 370 63 410 66 436 68 C 444 69 447 72 447 78 L 448 112 L 446 ${sill} L ${f(fr)} ${sill} A ${RA} ${RA} 0 1 0 ${f(fl)} ${sill} L ${f(rr)} ${sill} A ${RA} ${RA} 0 1 0 ${f(rl)} ${sill} Z`;
  const glass = "M 46 25 L 297 23 C 301 23 303 24 305 27 L 328 61 L 46 64 Z";
  const flare = (cx) => {
    const o = 49, i = RA, [ol, or] = arch(cx, o, 133), [il, ir] = arch(cx, i, sill);
    return `M ${f(ol)} 133 A ${o} ${o} 0 1 1 ${f(or)} 133 L ${f(ir + 1)} 133 L ${f(ir)} ${sill} A ${i} ${i} 0 1 0 ${f(il)} ${sill} L ${f(il - 1)} 133 Z`;
  };
  const wheel = (cx) => {
    let s = `<ellipse cx="${cx}" cy="${G + 0.5}" rx="${R + 4}" ry="3" fill="#000" opacity=".55"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#tyre${u})"/>`;
    // all-terrain tread blocks on the visible shoulder
    s += `<circle cx="${cx}" cy="${cy}" r="${R - 1.3}" fill="none" stroke="#1f2023" stroke-width="2.2" stroke-dasharray="2.6 1.8"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R - 4.5}" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1"/>`;
    s += `<path d="M ${cx - 26} ${cy - 13} A 29 29 0 0 1 ${cx + 22} ${cy - 18}" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>`;
    const rim = 20;
    s += `<circle cx="${cx}" cy="${cy}" r="${rim + 1}" fill="#0c0d0f"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${rim - 2}" fill="url(#barrel${u})"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="12.5" fill="url(#disc${u})"/>`;
    // brake caliper at the trailing edge, seen between the spokes
    const ca = -2.35, p = (a, r) => `${f(cx + Math.cos(a) * r)} ${f(cy + Math.sin(a) * r)}`;
    s += `<path d="M ${p(ca - 0.45, 16.5)} A 16.5 16.5 0 0 1 ${p(ca + 0.45, 16.5)} L ${p(ca + 0.5, 10)} A 10 10 0 0 0 ${p(ca - 0.5, 10)} Z" fill="url(#caliper${u})" stroke="#5a0b10" stroke-width=".5"/>`;
    // six wide, straight forged spokes
    let sp = "", hl = "";
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3 - Math.PI / 2 + 0.18;
      const q = (da, r) => p(a + da, r);
      sp += `<path d="M ${q(-0.42, 5.8)} L ${q(-0.2, rim - 1.6)} A ${rim - 1.6} ${rim - 1.6} 0 0 1 ${q(0.2, rim - 1.6)} L ${q(0.42, 5.8)} Z"/>`;
      hl += `<path d="M ${q(-0.36, 6.6)} L ${q(-0.17, rim - 2.2)}"/>`;
    }
    s += `<g fill="#4f535a" stroke="#16171a" stroke-width=".55">${sp}</g>`;
    s += `<g stroke="#9ea3ab" stroke-width=".6" stroke-opacity=".7" fill="none">${hl}</g>`;
    // machined lip and the rim edge
    s += `<circle cx="${cx}" cy="${cy}" r="${rim - 0.6}" fill="none" stroke="url(#lip${u})" stroke-width="2.2"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${rim + 0.6}" fill="none" stroke="#45484e" stroke-width="1"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="6.2" fill="url(#spoke${u})" stroke="#111" stroke-width=".6"/>`;
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; s += `<circle cx="${f(cx + Math.cos(a) * 4.4)}" cy="${f(cy + Math.sin(a) * 4.4)}" r=".9" fill="#c9ccd1"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="2.4" fill="#1b1c1f" stroke="#7d8189" stroke-width=".5"/>`;

function carSVG(car, uid) {

  x.font = `italic 900 ${rIn * 0.78}px ${DISP}`;
  if ("fontStretch" in x) x.fontStretch = "expanded";
  x.fillText(gtxt, cx, cy + rIn * 0.3);
  if ("fontStretch" in x) x.fontStretch = "normal";

  // speed + labels
  const sp = state.units === "mph" ? state.v * 2.23694 : state.v * 3.6;
  x.fillStyle = "#ffffff"; x.font = `600 ${rIn * 0.3}px ${DISP}`;
  x.fillText(String(Math.round(sp)), cx, cy + rIn * 0.6);
  x.fillStyle = COL.accent; x.font = `italic 800 ${rIn * 0.11}px ${DISP}`;
  x.fillText(state.units === "mph" ? "MPH" : "KM/H", cx, cy + rIn * 0.76);
  x.font = `italic 700 ${rIn * 0.12}px ${DISP}`; x.textAlign = "right";
  x.fillStyle = COL.fg; x.fillText(String(Math.round(rpm / 100) * 100), cx - rIn * 0.45, cy + rIn * 0.06);
  x.fillStyle = COL.muted; x.fillText("RPM", cx - rIn * 0.45, cy + rIn * 0.2);
  x.textAlign = "left";
  x.fillStyle = COL.fg; x.fillText("GEAR", cx + rIn * 0.45, cy + rIn * 0.06);
  x.fillStyle = COL.muted; x.fillText(c.ev ? "DRIVE" : "AUTO", cx + rIn * 0.45, cy + rIn * 0.2);

  // segmented throttle bar across the bottom of the dial
  const bw = R * 1.62, bh = R * 0.2, bx = cx - bw / 2, by = cy + R * 0.7;
  x.fillStyle = "#050506"; x.strokeStyle = COL.chromeLo; x.lineWidth = 2;
  roundRect(x, bx, by, bw, bh, R * 0.03); x.fill(); x.stroke();
  const segs = 14, mid0 = bw * 0.36, side = (bw - mid0) / 2 - R * 0.04;
  const sw = side / segs, pad = sw * 0.28, sy = by + bh * 0.16, sh = bh * 0.68;
  const vac = clamp(state.vac || 0, 0, 1), thr = state.thr;
  for (let i = 0; i < segs; i++) {
    // left: engine braking / lift-off, lights from the centre outwards
    const lx = bx + R * 0.04 + (segs - 1 - i) * sw;
    x.fillStyle = (i + 0.5) / segs <= vac ? "#4b8dff" : "#1a2333";
    x.fillRect(lx + pad / 2, sy, sw - pad, sh);
    // right: throttle, yellow to red
    const rx = bx + bw - R * 0.04 - side + i * sw;
    const hue = 52 - 52 * (i / (segs - 1));
    x.fillStyle = (i + 0.5) / segs <= thr ? `hsl(${hue} 100% 52%)` : `hsl(${hue} 45% 16%)`;
    x.fillRect(rx + pad / 2, sy, sw - pad, sh);
  }
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = COL.accent; x.font = `700 ${bh * 0.36}px ${DISP}`;
  x.fillText("THROTTLE", cx, by + bh * 0.36);
  x.fillStyle = "#4b8dff"; x.font = `600 ${bh * 0.3}px ${DISP}`;
  x.fillText(Math.round(thr * 100) + "%", cx, by + bh * 0.72);
}
function roundRect(x, l, t, w, h, r) {
  x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
  x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
}

/* ---------- UI wiring ---------- */
function renderCar() {
  const c = car();
  $("hero").innerHTML = carSVG(c, "hero");
  $("carName").textContent = c.name;
  $("carSpec").textContent = c.spec;
  [...$("picker").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === state.carIdx)));
  document.querySelectorAll(".turbo-row").forEach((el) => { el.hidden = CARS[state.carIdx].id !== "vtc"; }); // turbo build is VTC only
}
function buildPicker() {
  $("picker").innerHTML = CARS.map((c, i) => `<button data-i="${i}" aria-pressed="false">${carSVG(c, "p" + i)}<span>${c.short}</span><small>${c.ev ? "Electric" : c.cyl + " cyl"}</small></button>`).join("");
  $("picker").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    selectCar(+b.dataset.i);
  });
}
function setTurbo(on) {
  const was = car().id;
  state.turbo = on; store.set("turbo", on);
  $("turboOff").setAttribute("aria-pressed", String(!on));
  $("turboOn").setAttribute("aria-pressed", String(on));
  if (car().id !== was) { renderCar(); restartSound(); }
}
function restartSound() {
  if (state.engine === "off" || !snd) return;
  snd.shutdown(); snd = new EngineSound(car());
  state.rpm = 0; state.startAt = state.now + snd.starter(); setEngine("starting");
}
function selectCar(i) {
  if (i === state.carIdx) return;
  state.carIdx = i; store.set("car", i);
  state.gear = 0;
  renderCar();
  if (state.engine !== "off") { // swap engines on the fly
    if (snd) snd.shutdown();
    snd = new EngineSound(car());
    state.rpm = 0; state.startAt = state.now + snd.starter();
    setEngine("starting");
  }
}
function setEngine(st) {
  state.engine = st;
  const p = $("engPill");
  p.className = "pill " + (st === "on" ? "on" : st === "starting" ? "wait" : "");
  p.lastElementChild.textContent = st === "on" ? "Engine on" : st === "starting" ? "Cranking" : "Engine off";
  $("start").classList.toggle("running", st !== "off");
  $("startLabel").textContent = st === "off" ? "Start engine" : "Stop engine";
  $("startSub").textContent = st === "off" ? "Push to fire it up" : st === "starting" ? "Cranking…" : "Running · push to shut down";
}
let busy = false;
async function toggleEngine() {
  if (busy) return;
  ensureAudio();
  if (state.engine === "off") {
    if (state.mode === "gps") startGps();
    busy = true;
    try { await loadWorklet(); } finally { busy = false; }
    snd = new EngineSound(car());
    state.rpm = 0;
    state.startAt = state.now + snd.starter();
    setEngine("starting");
    requestWake();
  } else {
    if (snd) snd.shutdown();
    snd = null;
    setEngine("off");
    state.gear = 0;
    releaseWake();
  }
}
let wake = null;
async function requestWake() { try { wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; } }
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }

function setMode(m) {
  state.mode = m;
  $("modeGps").setAttribute("aria-pressed", String(m === "gps"));
  $("modeDemo").setAttribute("aria-pressed", String(m === "demo"));
  $("brakeBtn").hidden = m !== "demo";
  $("gasBtn").textContent = m === "demo" ? "Gas" : "Rev";
  $("hint").textContent = m === "demo"
    ? "Demo mode drives a virtual car. Hold Gas to accelerate and Brake to slow down. Keyboard: arrow up and arrow down."
    : "GPS mode follows your real speed. Hold Rev to blip the engine while stopped.";
  if (m === "gps") { if (state.engine !== "off") startGps(); }
  else { stopGps(); }
  state.v = 0;
}
function setUnits(u) {
  state.units = u; store.set("units", u);
  $("uKmh").setAttribute("aria-pressed", String(u === "kmh"));
  $("uMph").setAttribute("aria-pressed", String(u === "mph"));
}
function holdButton(el, key) {
  const on = (e) => { e.preventDefault(); state[key] = true; el.classList.add("down"); ensureAudio(); };
  const off = () => { state[key] = false; el.classList.remove("down"); };
  el.addEventListener("pointerdown", on);
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => el.addEventListener(ev, off));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

buildPicker(); renderCar();
$("start").addEventListener("click", toggleEngine);
$("modeGps").addEventListener("click", () => setMode("gps"));
$("modeDemo").addEventListener("click", () => setMode("demo"));
function setFly(f) {
  state.fly = f; store.set("fly", f);
  $("flyStock").setAttribute("aria-pressed", String(f === "stock"));
  $("flyLight").setAttribute("aria-pressed", String(f === "light"));
}
setFly(state.fly);
function setCam(m) {
  state.cam = m; store.set("cam", m);
  $("camStock").setAttribute("aria-pressed", String(m === "stock"));
  $("camRace").setAttribute("aria-pressed", String(m === "race"));
  $("camBig").setAttribute("aria-pressed", String(m === "big"));
}
setCam(state.cam);
$("camStock").addEventListener("click", () => setCam("stock"));
$("turboOff").setAttribute("aria-pressed", String(!state.turbo)); $("turboOn").setAttribute("aria-pressed", String(state.turbo));
$("turboOff").addEventListener("click", () => setTurbo(false));
$("turboOn").addEventListener("click", () => setTurbo(true));
$("camRace").addEventListener("click", () => setCam("race"));
$("camBig").addEventListener("click", () => setCam("big"));
$("flyStock").addEventListener("click", () => setFly("stock"));
$("flyLight").addEventListener("click", () => setFly("light"));
$("uKmh").addEventListener("click", () => setUnits("kmh"));
$("uMph").addEventListener("click", () => setUnits("mph"));
holdButton($("gasBtn"), "gas"); holdButton($("brakeBtn"), "brake");
$("vol").value = Math.round(state.volume * 100); $("volOut").textContent = $("vol").value + "%";
$("vol").addEventListener("input", (e) => {
  state.volume = e.target.value / 100; store.set("vol", state.volume);
  $("volOut").textContent = e.target.value + "%";
  if (master) master.gain.setTargetAtTime(state.volume, ctx.currentTime, 0.05);
  if (bangBus) bangBus.gain.setTargetAtTime(state.volume * state.bangVol, ctx.currentTime, 0.05);
  if (turboBus) turboBus.gain.setTargetAtTime(state.volume, ctx.currentTime, 0.05);
});
$("bangVol").value = Math.round(state.bangVol * 100); $("bangVolOut").textContent = $("bangVol").value + "%";
$("bangVol").addEventListener("input", (e) => {
  state.bangVol = e.target.value / 100; store.set("bangVol", state.bangVol);
  $("bangVolOut").textContent = e.target.value + "%";
  if (bangBus) bangBus.gain.setTargetAtTime(state.volume * state.bangVol, ctx.currentTime, 0.05);
  if (turboBus) turboBus.gain.setTargetAtTime(state.volume, ctx.currentTime, 0.05);
});
$("sens").value = Math.round(state.sens * 100); $("sensOut").textContent = state.sens.toFixed(1) + "×";
$("sens").addEventListener("input", (e) => {
  state.sens = e.target.value / 100; store.set("sens", state.sens);
  $("sensOut").textContent = state.sens.toFixed(1) + "×";
});
$("agg").value = Math.round(state.agg * 10); $("aggOut").textContent = state.agg.toFixed(1) + "×";
$("agg").addEventListener("input", (e) => {
  state.agg = e.target.value / 10; store.set("agg", state.agg);
  $("aggOut").textContent = state.agg.toFixed(1) + "×";
});
setUnits(state.units);
$("fsBtn").addEventListener("click", async () => {
  const on = !document.body.classList.contains("fs");
  document.body.classList.toggle("fs", on);
  try {
    if (on && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else if (!on && document.fullscreenElement) await document.exitFullscreen();
  } catch (e) {}
  setTimeout(resize, 60);
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("fs"); setTimeout(resize, 60); });
const keyMap = { ArrowUp: "gas", KeyW: "gas", ArrowDown: "brake", KeyS: "brake" };
addEventListener("keydown", (e) => { if (keyMap[e.code]) { state[keyMap[e.code]] = true; e.preventDefault(); } if (e.code === "Space") { e.preventDefault(); toggleEngine(); } });
addEventListener("keyup", (e) => { if (keyMap[e.code]) state[keyMap[e.code]] = false; });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.engine !== "off") { requestWake(); if (ctx) ctx.resume(); } });
addEventListener("resize", resize);
resize();

let last = performance.now();
function frame(ms) {
  const dt = clamp((ms - last) / 1000, 0, 0.1); last = ms;
  state.now = ms / 1000;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
